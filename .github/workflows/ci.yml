name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proposal:
    name: Proposal compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v3

      - name: Compile proposal
        run: typst compile proposal/main.typ

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: proposal
          path: proposal/main.pdf

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy

      - name: pytest
        # Exit code 5 means "no tests collected." Okay for now since we have no tests. We may
        # not want tests in general for this project
        run: uv run pytest || [ $? -eq 5 ]

  gloc:
    name: gloc churn
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so gloc can compute the merge-base against origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gloc
        run: |
          curl -fsSLO https://github.com/NoahSchiro/gloc-diff/releases/download/v1.0.0/gloc-x86_64-linux-musl.tar.gz
          curl -fsSLO https://github.com/NoahSchiro/gloc-diff/releases/download/v1.0.0/SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf gloc-x86_64-linux-musl.tar.gz
          sudo mv gloc /usr/local/bin/

      - name: Build the report
        run: |
          set +e
          ./gloc --base "origin/${{ github.base_ref }}" --style markdown \
            --depth 1 --max-src 1000 \
            > report.md 2> limits.txt
          status=$?
          set -e
          if [ "$status" -ge 2 ]; then
            cat limits.txt >&2
            exit 1
          fi
          {
            echo "<!-- gloc report: do not edit -->"
            echo "## gloc report"
            echo
            cat report.md
            echo
            if [ "$status" -eq 1 ]; then
              echo "> [!WARNING]"
              echo "> This PR exceeds the churn limits. Consider scoping it down or splitting it into smaller PRs."
              echo
              echo '```'
              cat limits.txt
              echo '```'
            else
              echo "✅ Within churn limits."
            fi
