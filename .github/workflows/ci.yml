name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proposal:
    name: Proposal compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v3

      - name: Compile proposal
        run: typst compile proposal/main.typ

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy

      - name: pytest
        # Exit code 5 means "no tests collected".
        # There are no tests right now so that is fine
        run: uv run pytest || [ $? -eq 5 ]
  
  report:
    name: Gloc report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gloc diffs from the merge-base with the base branch, so the
          # checkout needs full history for that merge-base to exist.
          fetch-depth: 0

      - name: Install gloc
        run: |
          curl -fsSLO https://github.com/NoahSchiro/gloc-diff/releases/download/v1.0.0/gloc-x86_64-linux-musl.tar.gz
          curl -fsSLO https://github.com/NoahSchiro/gloc-diff/releases/download/v1.0.0/SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf gloc-x86_64-linux-musl.tar.gz
          sudo mv gloc /usr/local/bin/

      - name: Build the report
        run: |
          set +e
          ./gloc \
            --base "origin/${{ github.base_ref }}" \
            --style markdown \
            --max-src 1000 \
            > report.md 2> limits.txt
          status=$?
          set -e
          if [ "$status" -ge 2 ]; then
            cat limits.txt >&2
            exit 1
          fi
          {
            echo "<!-- gloc report: do not edit -->"
            echo "## gloc report"
            echo
            cat report.md
            echo
            if [ "$status" -eq 1 ]; then
              echo "> [!WARNING]"
              echo "> This PR exceeds the churn limits. Consider scoping it down or splitting it into smaller PRs."
              echo
              echo '```'
              cat limits.txt
              echo '```'
            else
              echo "✅ Within churn limits."
            fi
          } > comment.md

      - name: Post the report
        # Fork PRs get a read-only token and cannot comment; the report is
        # still visible in this run's log.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="${{ github.event.pull_request.number }}"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
            --jq '.[] | select(.body | startswith("<!-- gloc report:")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F body=@comment.md > /dev/null
          else
            gh pr comment "$number" --body-file comment.md
          fi
