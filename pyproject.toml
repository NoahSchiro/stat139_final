[project]
name = "stat139-final"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[tool.mypy]
strict = true
files = ["."]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
